<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Mercado">
<title>Meu Mercado</title>
<link rel="icon" type="image/png" href="./logo.png">
<link rel="apple-touch-icon" href="./logo.png">
<link rel="manifest" href="./manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
.app{max-width:560px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px 30px}
header{padding:22px 4px 14px}h1{margin:0;font-size:30px} .sub{color:#6b7280;margin-top:4px}
.card{background:#fff;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #0000000b}
label{display:block;font-size:13px;font-weight:700;color:#4b5563;margin-bottom:6px}
input{width:100%;height:52px;border:1px solid #d1d5db;border-radius:14px;padding:0 14px;font-size:20px;outline:none}
input:focus{border-color:#111827;box-shadow:0 0 0 3px #11182712}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:14px;height:50px;font-size:17px;font-weight:700;cursor:pointer}
.primary{width:100%;background:#111827;color:white;margin-top:12px}.secondary{background:#e5e7eb;color:#111827}
.danger{background:#fee2e2;color:#991b1b}
.budget{display:flex;justify-content:space-between;align-items:center}.budget strong{font-size:24px}
.total{font-size:34px;font-weight:800;margin-top:4px}.remaining{font-size:14px;color:#6b7280}.over{color:#b91c1c!important}
.item{display:flex;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}
.item-name{font-weight:700}.item-meta{font-size:13px;color:#6b7280;margin-top:3px}.item-total{font-weight:800;white-space:nowrap}
.actions{display:flex;gap:6px;margin-top:8px}.mini{height:34px;padding:0 10px;font-size:13px;background:#f3f4f6}
.empty{text-align:center;color:#9ca3af;padding:24px 5px}
footer{padding:5px 4px 25px;color:#9ca3af;font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="app">
<header><h1>🛒 Meu Mercado</h1><div class="sub">Digite só os números no preço. Eu coloco a vírgula.</div></header>

<div class="card">
  <label>Limite da compra (opcional)</label>
  <input id="budget" inputmode="numeric" placeholder="Ex.: 30000">
</div>

<div class="card">
  <label>Produto</label>
  <input id="product" autocomplete="off" placeholder="Ex.: Arroz">
  <div class="row" style="margin-top:12px">
    <div><label>Quantidade</label><input id="qty" type="number" min="1" step="1" value="1" inputmode="numeric"></div>
    <div><label>Preço</label><input id="price" inputmode="numeric" autocomplete="off" placeholder="Ex.: 2490"></div>
  </div>
  <button class="primary" id="add">＋ Adicionar produto</button>
</div>

<div class="card budget">
  <div><div class="remaining">TOTAL DA COMPRA</div><div class="total" id="total">R$ 0,00</div></div>
  <button class="secondary" id="clear">Nova compra</button>
</div>

<div class="card" id="budgetCard" style="display:none">
  <div class="remaining">RESTANTE DO LIMITE</div>
  <div class="total" id="remaining">R$ 0,00</div>
</div>

<div class="card">
  <div id="list"></div>
</div>
<footer>Os dados ficam salvos neste aparelho.</footer>
</div>

<script>
const $=id=>document.getElementById(id);
let items=JSON.parse(localStorage.getItem('meuMercadoItems')||'[]');
let budgetCents=parseInt(localStorage.getItem('meuMercadoBudget')||'0',10)||0;
$('budget').value=budgetCents?String(budgetCents):'';

function money(c){return (c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function centsFromDigits(v){let d=String(v||'').replace(/\D/g,''); return d?parseInt(d,10):0;}
function formatPriceInput(el){
  const c=centsFromDigits(el.value);
  el.value=c?String(c):'';
}
function save(){localStorage.setItem('meuMercadoItems',JSON.stringify(items));localStorage.setItem('meuMercadoBudget',String(budgetCents));}
function render(){
  const total=items.reduce((s,i)=>s+i.qty*i.price,0);
  $('total').textContent=money(total);
  $('budgetCard').style.display=budgetCents?'block':'none';
  const rem=budgetCents-total;
  $('remaining').textContent=money(rem);
  $('remaining').classList.toggle('over',rem<0);
  const list=$('list'); list.innerHTML='';
  if(!items.length){list.innerHTML='<div class="empty">Nenhum produto adicionado ainda.<br>Comece pelo primeiro item 👇</div>';return;}
  items.forEach((i,idx)=>{
    const div=document.createElement('div');div.className='item';
    div.innerHTML=`<div><div class="item-name">${escapeHtml(i.name)}</div><div class="item-meta">${i.qty} × ${money(i.price)}</div>
      <div class="actions"><button class="mini" onclick="editItem(${idx})">Editar</button><button class="mini danger" onclick="removeItem(${idx})">Excluir</button></div></div>
      <div class="item-total">${money(i.qty*i.price)}</div>`;
    list.appendChild(div);
  });
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function addItem(){
  const name=$('product').value.trim(), qty=Math.max(1,parseInt($('qty').value,10)||1), price=centsFromDigits($('price').value);
  if(!name){$('product').focus();return}
  if(!price){$('price').focus();return}
  items.push({name,qty,price});save();render();
  $('product').value='';$('qty').value='1';$('price').value='';$('product').focus();
}
window.removeItem=function(i){items.splice(i,1);save();render();}
window.editItem=function(i){
  const x=items[i];$('product').value=x.name;$('qty').value=x.qty;$('price').value=String(x.price);
  items.splice(i,1);save();render();$('product').focus();
}
$('price').addEventListener('input',e=>formatPriceInput(e.target));
$('budget').addEventListener('input',e=>{budgetCents=centsFromDigits(e.target.value);e.target.value=budgetCents?String(budgetCents):'';save();render();});
$('add').addEventListener('click',addItem);
$('product').addEventListener('keydown',e=>{if(e.key==='Enter')$('qty').focus()});
$('qty').addEventListener('keydown',e=>{if(e.key==='Enter')$('price').focus()});
$('price').addEventListener('keydown',e=>{if(e.key==='Enter')addItem()});
$('clear').addEventListener('click',()=>{if(confirm('Começar uma nova compra? Isso apagará os produtos atuais.')){items=[];budgetCents=0;save();$('budget').value='';render();}});
render();
</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script>
</body>
</html>
